name: Monthly dependency patch worker

on:
  workflow_call:
    inputs:
      mode:
        description: Fixed owner-approved fork execution
        type: string
        required: true
      month:
        description: Fixed trial month 2026-10
        type: string
        required: false
      controller_issue:
        description: Trusted cycle issue in yizha1/notation, required for execution
        type: string
        required: false
      plan_id:
        description: Approved assessment digest, required for execution
        type: string
        required: false
      attempt:
        description: Dispatched worker attempt, required for execution
        type: string
        required: false
      worker_sha:
        description: Authorized immutable commit of the central notation automation
        type: string
        required: true
    secrets:
      MONTHLY_PATCH_TOKEN:
        description: Release identity token, required for execution
        required: false
      MONTHLY_PATCH_SIGNING_KEY:
        description: Release signing key, required for execution
        required: false

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: monthly-dependency-patch-${{ github.repository }}
  cancel-in-progress: false

env:
  GOWORK: 'off'
  GOTOOLCHAIN: local
  MONTHLY_PATCH_COORDINATOR_REQUIRED: 'true'
  MONTHLY_PATCH_FORK_MANUAL_ENABLED: ${{ vars.MONTHLY_PATCH_FORK_MANUAL_ENABLED }}
  MONTHLY_PATCH_FORK_DEPLOYMENT_SHA: ${{ vars.MONTHLY_PATCH_FORK_DEPLOYMENT_SHA }}
  MONTHLY_PATCH_FORK_CALLER_SHA: ${{ vars.MONTHLY_PATCH_FORK_CALLER_SHA }}
  MONTHLY_PATCH_ACTOR: ${{ vars.MONTHLY_PATCH_ACTOR }}
  MONTHLY_PATCH_CONTROLLER_ISSUE: ${{ inputs.controller_issue }}
  MONTHLY_PATCH_CONTROLLER_PLAN: ${{ inputs.plan_id }}
  MONTHLY_PATCH_CONTROLLER_ATTEMPT: ${{ inputs.attempt }}
  MONTHLY_PATCH_WORKER_SHA: ${{ inputs.worker_sha }}

jobs:
  prepare:
    if: >-
      contains(fromJSON('["yizha1/notation-core-go","yizha1/notation-go","yizha1/notation"]'), github.repository) &&
      github.ref == 'refs/heads/monthly-manual-executor-20261018' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.mode == 'dry-run' || (inputs.mode == 'execute' && github.actor == vars.MONTHLY_PATCH_ACTOR))
    runs-on: ubuntu-24.04
    outputs:
      action: ${{ steps.cycle.outputs.action }}
      commit: ${{ steps.cycle.outputs.commit }}
      tag: ${{ steps.cycle.outputs.tag }}
      baseline: ${{ steps.cycle.outputs.baseline }}
      minimum_go: ${{ steps.cycle.outputs.minimum_go }}
      mode: ${{ steps.cycle.outputs.mode }}
      month: ${{ steps.cycle.outputs.month }}
      cycle_id: ${{ steps.cycle.outputs.cycle_id }}
      status: ${{ steps.cycle.outputs.status }}
      worker_sha: ${{ steps.authorize-worker.outputs.worker_sha }}
    steps:
      - name: Bind central automation to the invoked reusable workflow
        id: authorize-worker
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKER_SHA: ${{ inputs.worker_sha }}
          DEPLOYMENT_SHA: ${{ vars.MONTHLY_PATCH_FORK_DEPLOYMENT_SHA }}
          CALLER_SHA: ${{ vars.MONTHLY_PATCH_FORK_CALLER_SHA }}
          ENABLED: ${{ vars.MONTHLY_PATCH_FORK_MANUAL_ENABLED }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["EXPECTED_WORKER_SHA"]
          if (
              repository not in {
                  "yizha1/notation-core-go",
                  "yizha1/notation-go",
                  "yizha1/notation",
              }
              or os.environ["GITHUB_REF"] != "refs/heads/monthly-manual-executor-20261018"
              or os.environ["GITHUB_EVENT_NAME"] != "workflow_dispatch"
              or not re.fullmatch(r"[0-9a-f]{40}", sha)
              or (repository == "yizha1/notation" and sha != os.environ["GITHUB_SHA"])
          ):
              raise SystemExit("Invalid canonical worker invocation")
          run = json.loads(subprocess.check_output([
              "gh", "api",
              f"repos/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          ], text=True))
          if (
              run.get("repository", {}).get("full_name") != repository
              or run.get("head_branch") != "monthly-manual-executor-20261018"
              or run.get("event") != "workflow_dispatch"
              or run.get("head_sha") != os.environ["GITHUB_SHA"]
          ):
              raise SystemExit("Run does not match the canonical caller")
          expected_path = f"yizha1/notation/.github/workflows/monthly-patch-worker.yml@{sha}"
          references = [
              entry for entry in run.get("referenced_workflows", [])
              if entry.get("path", "").split("@", 1)[0] == expected_path.split("@", 1)[0]
          ]
          if (
              len(references) != 1
              or references[0].get("path") != expected_path
              or references[0].get("sha") != sha
          ):
              raise SystemExit("Central worker SHA does not match the invoked reusable workflow")
          if (
              sha != os.environ["DEPLOYMENT_SHA"]
              or os.environ["GITHUB_SHA"] != os.environ["CALLER_SHA"]
              or os.environ["GITHUB_ACTOR"] != "yizha1"
              or os.environ["ENABLED"] != "true"
              or run.get("actor", {}).get("login") != "yizha1"
              or run.get("run_attempt") != 1
          ):
              raise SystemExit("Unreviewed fork deployment revision or actor")
          ref = json.loads(subprocess.check_output([
              "gh", "api", "repos/yizha1/notation/branches/monthly-manual-executor-20261018",
          ], text=True))
          if ref["commit"]["sha"] != sha:
              raise SystemExit("Shared fork deployment ref moved")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"worker_sha={sha}\n")
          PY
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: yizha1/notation
          ref: ${{ steps.authorize-worker.outputs.worker_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: 'target/**/go.sum'
      - name: Test orchestration before using repository credentials
        working-directory: automation/.github/scripts
        env:
          MONTHLY_PATCH_COORDINATOR_REQUIRED: 'false'
        run: |
          python3 -m unittest discover -s . -p 'test_fork_manual_executor.py'
          python3 -m unittest discover -s . -p 'test_fork_release_presentation.py'
          python3 -m unittest discover -s . -p 'test_fork_draft_download.py'
          python3 -m unittest discover -s . -p 'test_worker_bootstrap_release.py'
          python3 -m unittest discover -s . -p 'test_monthly_release_checks.py'
      - name: Merge checked Dependabot PRs and prepare an unpushed release candidate
        id: cycle
        env:
          GH_TOKEN: ${{ inputs.mode == 'execute' && secrets.MONTHLY_PATCH_TOKEN || github.token }}
          MONTHLY_PATCH_TOKEN_READY: ${{ inputs.mode == 'execute' && secrets.MONTHLY_PATCH_TOKEN != '' }}
          MONTHLY_PATCH_ENABLED: ${{ vars.MONTHLY_PATCH_ENABLED }}
          MONTHLY_PATCH_SIGNING_KEY: ${{ inputs.mode == 'execute' && secrets.MONTHLY_PATCH_SIGNING_KEY || '' }}
          MONTHLY_PATCH_SIGNER_EMAIL: ${{ vars.MONTHLY_PATCH_SIGNER_EMAIL }}
          MONTHLY_PATCH_SIGNER_NAME: ${{ vars.MONTHLY_PATCH_SIGNER_NAME }}
          MONTHLY_PATCH_SIGNER_LOGIN: ${{ vars.MONTHLY_PATCH_SIGNER_LOGIN }}
          MONTHLY_PATCH_ACTOR: ${{ vars.MONTHLY_PATCH_ACTOR }}
          MODE: ${{ inputs.mode }}
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          args=(--start)
          if [[ -n "$REQUESTED_MONTH" ]]; then args+=(--month "$REQUESTED_MONTH"); fi
          python3 automation/.github/scripts/monthly_release.py prepare \
            --directory target --mode "$MODE" --output "$RUNNER_TEMP/monthly-candidate" "${args[@]}"
      - name: Retain cycle plan and candidate bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monthly-candidate
          path: |
            ${{ runner.temp }}/monthly-candidate/plan.json
            ${{ runner.temp }}/monthly-candidate/candidate.bundle
          if-no-files-found: warn

  propagation-prepare:
    needs: prepare
    if: needs.prepare.outputs.action == 'waiting' && needs.prepare.outputs.status == 'waiting'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: yizha1/notation
          ref: ${{ needs.prepare.outputs.worker_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: monthly-candidate
          path: ${{ runner.temp }}/monthly-candidate
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false
      - name: Prepare producer-only manifest patch without write credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 automation/.github/scripts/notation_fork_propagation.py prepare \
            --plan "$RUNNER_TEMP/monthly-candidate/plan.json" --output "$RUNNER_TEMP/propagation"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monthly-propagation
          path: ${{ runner.temp }}/propagation/propagation.json
          if-no-files-found: error

  propagation-publish:
    needs: [prepare, propagation-prepare]
    if: needs.propagation-prepare.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: yizha1/notation
          ref: ${{ needs.prepare.outputs.worker_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: monthly-propagation
          path: ${{ runner.temp }}/propagation
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
          cache: false
      - name: Revalidate and sign only the exact producer-scoped PR
        env:
          GH_TOKEN: ${{ secrets.MONTHLY_PATCH_TOKEN }}
          MONTHLY_PATCH_TOKEN_READY: ${{ secrets.MONTHLY_PATCH_TOKEN != '' }}
          MONTHLY_PATCH_SIGNING_KEY: ${{ secrets.MONTHLY_PATCH_SIGNING_KEY }}
          MONTHLY_PATCH_SIGNER_LOGIN: ${{ vars.MONTHLY_PATCH_SIGNER_LOGIN }}
          MONTHLY_PATCH_SIGNER_EMAIL: ${{ vars.MONTHLY_PATCH_SIGNER_EMAIL }}
          MONTHLY_PATCH_SIGNER_NAME: ${{ vars.MONTHLY_PATCH_SIGNER_NAME }}
        run: |
          python3 automation/.github/scripts/notation_fork_propagation.py publish \
            --prepared "$RUNNER_TEMP/propagation/propagation.json" --output "$RUNNER_TEMP/propagation-result"

  qualify:
    needs: prepare
    if: needs.prepare.outputs.action == 'qualify'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version: ['${{ needs.prepare.outputs.minimum_go }}', stable]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: yizha1/notation
          ref: ${{ needs.prepare.outputs.worker_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: monthly-candidate
          path: ${{ runner.temp }}/monthly-candidate
      - name: Import the exact unpushed candidate
        run: |
          python3 automation/.github/scripts/monthly_release.py import \
            --directory candidate --plan "$RUNNER_TEMP/monthly-candidate/plan.json" \
            --bundle "$RUNNER_TEMP/monthly-candidate/candidate.bundle" \
            --output "$RUNNER_TEMP/imported"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: 'candidate/**/go.sum'
      - name: Install pinned qualification tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/apache/skywalking-eyes/cmd/license-eye@v0.9.0
      - name: Qualify modules, tests, licensing and vulnerabilities
        env:
          MONTHLY_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          MONTHLY_PATCH_ADVISORY_DISPOSITIONS: ''
        run: |
          python3 automation/.github/scripts/qualify_monthly_candidate.py candidate \
            --repository "$GITHUB_REPOSITORY" --evidence "$RUNNER_TEMP/source-evidence"
      - name: Retain race coverage, tests and scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monthly-source-${{ matrix.go-version }}
          path: ${{ runner.temp }}/source-evidence/
          if-no-files-found: warn

  package:
    needs: [prepare, qualify]
    if: >-
      always() && needs.prepare.result == 'success' &&
      ((needs.prepare.outputs.action == 'qualify' && needs.qualify.result == 'success') ||
       needs.prepare.outputs.action == 'package')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: yizha1/notation
          ref: ${{ needs.prepare.outputs.worker_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: monthly-candidate
          path: ${{ runner.temp }}/monthly-candidate
      - name: Import or check out the exact qualified commit
        env:
          ACTION: ${{ needs.prepare.outputs.action }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          if [[ "$ACTION" == qualify ]]; then
            python3 automation/.github/scripts/monthly_release.py import \
              --directory candidate --plan "$RUNNER_TEMP/monthly-candidate/plan.json" \
              --bundle "$RUNNER_TEMP/monthly-candidate/candidate.bundle" \
              --output "$RUNNER_TEMP/imported"
          else
            git -C candidate checkout --detach "$COMMIT"
          fi
      - name: Stage an unpushed local tag for packaging without any signing credentials
        if: needs.prepare.outputs.action == 'qualify'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          git -C candidate -c user.name=Packaging -c user.email=packaging@example.invalid \
            -c tag.gpgsign=false tag -a "$TAG" "$COMMIT" -m "Unpublished packaging tag"
      - name: Fetch the immutable tag without overwriting it
        if: needs.prepare.outputs.action == 'package'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git -C candidate fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: 'candidate/**/go.sum'
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        if: github.event.repository.name == 'notation'
        env:
          GORELEASER_PREVIOUS_TAG: ${{ needs.prepare.outputs.baseline }}
        with:
          workdir: candidate
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --skip=publish --config ../automation/.github/monthly-goreleaser.yml
      - name: Build library source archives or validate every CLI archive
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          MONTHLY_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          MONTHLY_PATCH_ADVISORY_DISPOSITIONS: ''
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          python3 automation/.github/scripts/build_monthly_assets.py candidate \
            --repository "$GITHUB_REPOSITORY" --tag "$TAG" --commit "$COMMIT" \
            --evidence "$RUNNER_TEMP/build-evidence"
      - name: Retain qualified assets without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monthly-built-assets
          path: candidate/dist/*
          if-no-files-found: error
      - name: Retain binary gate results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monthly-build-evidence
          path: ${{ runner.temp }}/build-evidence/
          if-no-files-found: warn

  publish:
    needs: [prepare, qualify, package]
    if: >-
      always() && needs.prepare.result == 'success' && needs.package.result == 'success' &&
      inputs.mode == 'execute' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/monthly-manual-executor-20261018' && github.actor == vars.MONTHLY_PATCH_ACTOR &&
      ((needs.prepare.outputs.action == 'qualify' && needs.qualify.result == 'success') ||
       needs.prepare.outputs.action == 'package')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: yizha1/notation
          ref: ${{ needs.prepare.outputs.worker_sha }}
          persist-credentials: false
          path: automation
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          path: candidate
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: monthly-candidate
          path: ${{ runner.temp }}/monthly-candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: monthly-built-assets
          path: ${{ runner.temp }}/monthly-assets
      - name: Import immutable candidate without running source or build commands
        env:
          ACTION: ${{ needs.prepare.outputs.action }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          if [[ "$ACTION" == qualify ]]; then
            python3 automation/.github/scripts/monthly_release.py import --directory candidate \
              --plan "$RUNNER_TEMP/monthly-candidate/plan.json" \
              --bundle "$RUNNER_TEMP/monthly-candidate/candidate.bundle" \
              --output "$RUNNER_TEMP/imported"
          else
            git -C candidate checkout --detach "$COMMIT"
          fi
      - name: Stage the exact signed tag in the isolated publisher
        if: needs.prepare.outputs.action == 'qualify'
        env:
          GH_TOKEN: ${{ secrets.MONTHLY_PATCH_TOKEN }}
          MONTHLY_PATCH_TOKEN_READY: ${{ secrets.MONTHLY_PATCH_TOKEN != '' }}
          MONTHLY_PATCH_ENABLED: ${{ vars.MONTHLY_PATCH_ENABLED }}
          MONTHLY_PATCH_SIGNING_KEY: ${{ secrets.MONTHLY_PATCH_SIGNING_KEY }}
          MONTHLY_PATCH_SIGNER_EMAIL: ${{ vars.MONTHLY_PATCH_SIGNER_EMAIL }}
          MONTHLY_PATCH_SIGNER_NAME: ${{ vars.MONTHLY_PATCH_SIGNER_NAME }}
          MONTHLY_PATCH_SIGNER_LOGIN: ${{ vars.MONTHLY_PATCH_SIGNER_LOGIN }}
          MONTHLY_PATCH_ACTOR: ${{ vars.MONTHLY_PATCH_ACTOR }}
        run: |
          python3 automation/.github/scripts/monthly_release.py stage-tag --directory candidate \
            --plan "$RUNNER_TEMP/monthly-candidate/plan.json" --output "$RUNNER_TEMP/staged"
      - name: Atomically publish the branch and signed tag after every asset gate
        if: needs.prepare.outputs.action == 'qualify'
        env:
          GH_TOKEN: ${{ secrets.MONTHLY_PATCH_TOKEN }}
          MONTHLY_PATCH_TOKEN_READY: ${{ secrets.MONTHLY_PATCH_TOKEN != '' }}
          MONTHLY_PATCH_ENABLED: ${{ vars.MONTHLY_PATCH_ENABLED }}
          MONTHLY_PATCH_SIGNING_KEY: ${{ secrets.MONTHLY_PATCH_SIGNING_KEY }}
          MONTHLY_PATCH_SIGNER_EMAIL: ${{ vars.MONTHLY_PATCH_SIGNER_EMAIL }}
          MONTHLY_PATCH_SIGNER_NAME: ${{ vars.MONTHLY_PATCH_SIGNER_NAME }}
          MONTHLY_PATCH_SIGNER_LOGIN: ${{ vars.MONTHLY_PATCH_SIGNER_LOGIN }}
          MONTHLY_PATCH_ACTOR: ${{ vars.MONTHLY_PATCH_ACTOR }}
        run: |
          python3 automation/.github/scripts/monthly_release.py tag --directory candidate \
            --plan "$RUNNER_TEMP/monthly-candidate/plan.json" \
            --output "$RUNNER_TEMP/tagged"
      - name: Create or resume a true draft with only the qualified assets (never publish)
        id: release
        env:
          GH_TOKEN: ${{ secrets.MONTHLY_PATCH_TOKEN }}
          MONTHLY_PATCH_TOKEN_READY: ${{ secrets.MONTHLY_PATCH_TOKEN != '' }}
          MONTHLY_PATCH_ENABLED: ${{ vars.MONTHLY_PATCH_ENABLED }}
          MONTHLY_PATCH_SIGNING_KEY: ${{ secrets.MONTHLY_PATCH_SIGNING_KEY }}
          MONTHLY_PATCH_SIGNER_EMAIL: ${{ vars.MONTHLY_PATCH_SIGNER_EMAIL }}
          MONTHLY_PATCH_SIGNER_NAME: ${{ vars.MONTHLY_PATCH_SIGNER_NAME }}
          MONTHLY_PATCH_SIGNER_LOGIN: ${{ vars.MONTHLY_PATCH_SIGNER_LOGIN }}
          MONTHLY_PATCH_ACTOR: ${{ vars.MONTHLY_PATCH_ACTOR }}
          ACTION: ${{ needs.prepare.outputs.action }}
        run: |
          plan="$RUNNER_TEMP/monthly-candidate/plan.json"
          if [[ "$ACTION" == qualify ]]; then plan="$RUNNER_TEMP/tagged/plan.json"; fi
          python3 automation/.github/scripts/monthly_release.py publish \
            --directory "$RUNNER_TEMP/monthly-assets" --plan "$plan" --output "$RUNNER_TEMP/published"
      - name: Retain publication manifest and binary gate results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monthly-publication
          path: ${{ runner.temp }}/published/plan.json
          if-no-files-found: warn

  download-draft:
    needs: [prepare, publish]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.publish.result == 'success' || needs.prepare.outputs.action == 'draft-check')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: yizha1/notation
          ref: ${{ needs.prepare.outputs.worker_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.publish.result == 'success'
        with:
          name: monthly-publication
          path: ${{ runner.temp }}/publication
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.prepare.outputs.action == 'draft-check'
        with:
          name: monthly-candidate
          path: ${{ runner.temp }}/publication
      - name: Fetch exact draft bytes without checking out or executing candidate code
        env:
          GH_TOKEN: ${{ secrets.MONTHLY_PATCH_TOKEN }}
        run: |
          python3 automation/.github/scripts/fork_draft_download.py \
            --plan "$RUNNER_TEMP/publication/plan.json" --output "$RUNNER_TEMP/draft-download"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: monthly-recorded-draft-bytes
          path: ${{ runner.temp }}/draft-download/
          if-no-files-found: error

  verify:
    needs: [prepare, publish, download-draft]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.download-draft.result == 'success' || needs.prepare.outputs.action == 'verify')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_amd64
          - os: macos-14
            platform: darwin_arm64
          - os: windows-latest
            platform: windows_amd64
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: yizha1/notation
          ref: ${{ needs.prepare.outputs.worker_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ github.repository }}
          path: candidate
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.download-draft.result == 'success'
        with:
          name: monthly-recorded-draft-bytes
          path: ${{ runner.temp }}/publication
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.prepare.outputs.action == 'verify'
        with:
          name: monthly-candidate
          path: ${{ runner.temp }}/publication
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: 'candidate/**/go.sum'
      - name: Test trusted downloaded draft bytes without release credentials, or public assets anonymously
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
          MONTHLY_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          MONTHLY_PATCH_ADVISORY_DISPOSITIONS: ''
          ACTION: ${{ needs.prepare.outputs.action }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          args=()
          if [[ "$ACTION" != verify ]]; then args+=(--downloaded-assets "$RUNNER_TEMP/publication"); fi
          python3 automation/.github/scripts/test_monthly_public_release.py \
            --plan "$RUNNER_TEMP/publication/plan.json" --source candidate \
            --platform "$PLATFORM" --evidence "$RUNNER_TEMP/public-evidence" "${args[@]}"
      - name: Retain native functional tests and packaged-binary E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monthly-${{ needs.prepare.outputs.action == 'verify' && 'public' || 'draft' }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/public-evidence/
          if-no-files-found: warn

  complete:
    needs: [prepare, publish, verify]
    if: >-
      always() && needs.prepare.result == 'success' && needs.verify.result == 'success' &&
      inputs.mode == 'execute' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/monthly-manual-executor-20261018' && github.actor == vars.MONTHLY_PATCH_ACTOR &&
      (needs.publish.result == 'success' || needs.prepare.outputs.action == 'verify' ||
       needs.prepare.outputs.action == 'draft-check')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: yizha1/notation
          ref: ${{ needs.prepare.outputs.worker_sha }}
          path: automation
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.publish.result == 'success'
        with:
          name: monthly-publication
          path: ${{ runner.temp }}/publication
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.prepare.outputs.action == 'verify' || needs.prepare.outputs.action == 'draft-check'
        with:
          name: monthly-candidate
          path: ${{ runner.temp }}/publication
      - name: Request qualified draft review, or complete only after human publication and public verification
        env:
          GH_TOKEN: ${{ secrets.MONTHLY_PATCH_TOKEN }}
          MONTHLY_PATCH_TOKEN_READY: ${{ secrets.MONTHLY_PATCH_TOKEN != '' }}
          MONTHLY_PATCH_ENABLED: ${{ vars.MONTHLY_PATCH_ENABLED }}
          MONTHLY_PATCH_SIGNING_KEY: ${{ secrets.MONTHLY_PATCH_SIGNING_KEY }}
          MONTHLY_PATCH_SIGNER_EMAIL: ${{ vars.MONTHLY_PATCH_SIGNER_EMAIL }}
          MONTHLY_PATCH_SIGNER_LOGIN: ${{ vars.MONTHLY_PATCH_SIGNER_LOGIN }}
          MONTHLY_PATCH_ACTOR: ${{ vars.MONTHLY_PATCH_ACTOR }}
        run: |
          python3 automation/.github/scripts/monthly_release.py complete \
            --plan "$RUNNER_TEMP/publication/plan.json" --output "$RUNNER_TEMP/completed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monthly-completed
          path: ${{ runner.temp }}/completed/plan.json
          if-no-files-found: error

  record-failure:
    needs: [prepare, propagation-prepare, propagation-publish, qualify, package, publish, download-draft, verify, complete]
    if: >-
      always() && contains(needs.*.result, 'failure') &&
      inputs.mode == 'execute' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/monthly-manual-executor-20261018' && github.actor == vars.MONTHLY_PATCH_ACTOR &&
      needs.prepare.outputs.worker_sha != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: yizha1/notation
          ref: ${{ needs.prepare.outputs.worker_sha }}
          path: automation
          persist-credentials: false
      - name: Keep consumers blocked and record the failure for the next retry
        env:
          GH_TOKEN: ${{ secrets.MONTHLY_PATCH_TOKEN }}
          MONTHLY_PATCH_TOKEN_READY: ${{ secrets.MONTHLY_PATCH_TOKEN != '' }}
          MONTHLY_PATCH_ENABLED: ${{ vars.MONTHLY_PATCH_ENABLED }}
          MONTHLY_PATCH_SIGNER_EMAIL: ${{ vars.MONTHLY_PATCH_SIGNER_EMAIL }}
          MONTHLY_PATCH_SIGNER_LOGIN: ${{ vars.MONTHLY_PATCH_SIGNER_LOGIN }}
          MONTHLY_PATCH_ACTOR: ${{ vars.MONTHLY_PATCH_ACTOR }}
          MODE: ${{ needs.prepare.outputs.mode }}
          MONTH: ${{ needs.prepare.outputs.month }}
          CYCLE_ID: ${{ needs.prepare.outputs.cycle_id }}
          FAILURE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, "automation/.github/scripts")
          import monthly_release as release
          import notation_release_controller as controller
          for stage, result in json.loads(os.environ["JOB_RESULTS"]).items():
              if result["result"] == "failure":
                  print(json.dumps(controller.failure(
                      release.GitHub(), os.environ["GITHUB_REPOSITORY"], stage,
                      f"Required {stage} job failed; inspect its exact log and retained evidence. No gate is waived.",
                  )))
          PY
