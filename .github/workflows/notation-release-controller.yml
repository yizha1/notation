name: Manual fork release controller
run-name: 'Monthly patch ${{ inputs.month }} ${{ inputs.plan_id }} #${{ inputs.controller_issue }} attempt ${{ inputs.attempt }}'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Owner-approved fixed fork trial execution
        type: choice
        options: [execute]
        default: execute
        required: true
      month:
        description: Fixed trial month, 2026-10
        type: string
        default: 2026-10
        required: true
      controller_issue:
        description: Fixed owner review issue 26
        type: string
        required: false
      plan_id:
        description: Fixed approved fork plan digest
        type: string
        required: false
      attempt:
        description: Dispatched worker attempt, required for execution
        type: string
        required: false

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  release:
    uses: ./.github/workflows/monthly-patch-worker.yml
    with:
      mode: ${{ inputs.mode }}
      month: ${{ inputs.month }}
      controller_issue: ${{ inputs.controller_issue }}
      plan_id: ${{ inputs.plan_id }}
      attempt: ${{ inputs.attempt }}
      worker_sha: ${{ github.sha }}
    secrets:
      MONTHLY_PATCH_TOKEN: ${{ inputs.mode == 'execute' && secrets.MONTHLY_PATCH_TOKEN || '' }}
      MONTHLY_PATCH_SIGNING_KEY: ${{ inputs.mode == 'execute' && secrets.MONTHLY_PATCH_SIGNING_KEY || '' }}
