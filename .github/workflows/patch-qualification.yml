name: Patch trial qualification

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'yizha1/notation' && vars.PATCH_TRIAL_ENABLED == 'true' && (startsWith(github.base_ref, 'release-') || startsWith(github.ref, 'refs/heads/release-') || contains(github.ref_name, '-trial.') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26', stable]
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            test/e2e/go.sum
            test/e2e/plugin/go.sum
      - name: Record compiler and verify dependency integrity
        run: |
          go version
          for module in . test/e2e test/e2e/plugin; do
            (
              cd "$module"
              go mod download
              go mod verify
              go mod tidy
            )
          done
          python3 .github/scripts/check_trial_dependencies.py
          git diff --exit-code -- '**/go.mod' '**/go.sum' go.mod go.sum
      - name: Test automation and run vet, unit tests, and E2E tests
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          for module in . test/e2e test/e2e/plugin; do
            (cd "$module" && go vet ./...)
          done
          (cd test/e2e/plugin && go test -race ./...)
          make test
          make e2e
      - name: Install pinned vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Scan production and test module graphs
        run: |
          mkdir -p vulnerability-results
          status=0
          for module in . test/e2e test/e2e/plugin; do
            case "$module" in
              .) name=root ;;
              test/e2e) name=e2e ;;
              test/e2e/plugin) name=plugin ;;
            esac
            if (cd "$module" && govulncheck -test ./...) > "vulnerability-results/$name.txt" 2>&1; then
              cat "vulnerability-results/$name.txt"
            else
              cat "vulnerability-results/$name.txt"
              status=1
            fi
          done
          exit "$status"
      - name: Retain vulnerability evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulnerability-results-${{ matrix.go-version }}
          path: vulnerability-results/
          if-no-files-found: warn
