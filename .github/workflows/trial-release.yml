name: Fork-only draft release

on:
  push:
    tags:
      - 'v*-trial.*'

permissions:
  contents: read

concurrency:
  group: trial-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualification:
    if: github.repository == 'yizha1/notation' && vars.PATCH_TRIAL_ENABLED == 'true'
    uses: ./.github/workflows/patch-qualification.yml
  draft:
    needs: qualification
    if: github.repository == 'yizha1/notation' && vars.PATCH_TRIAL_ENABLED == 'true' && needs.qualification.result == 'success'
    runs-on: ubuntu-24.04
    env:
      GOWORK: 'off'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Preserve the annotated tag by checking out its commit.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true
      - name: Validate trial tag and prepare release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="${GITHUB_REF_NAME%-trial.*}"
          line="${base%.*}"
          git fetch --no-tags https://github.com/notaryproject/notation.git \
            "refs/tags/$line.*:refs/tags/$line.*"
          previous=$(python3 .github/scripts/monthly_patch.py previous-tag "$GITHUB_REF_NAME")
          echo "GORELEASER_PREVIOUS_TAG=$previous" >> "$GITHUB_ENV"
          if [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != tag ]]; then
            echo "::error::Expected a signed annotated trial tag"
            exit 1
          fi
          if [[ "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::Trial tag does not match the qualified commit"
            exit 1
          fi
          tag_object=$(git rev-parse "$GITHUB_REF_NAME")
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified' | grep -x true
          {
            echo 'Trial only; not an official Notary Project release.'
            echo
            go version
            echo
            echo "Candidate commit: $GITHUB_SHA"
            echo "Previous stable tag: $previous"
            echo
            git log --format='* %s (%h)' "$previous..$GITHUB_SHA"
            for module in . test/e2e test/e2e/plugin; do
              echo
              echo "Module manifest: $module/go.mod"
              echo '```go'
              cat "$module/go.mod"
              echo '```'
            done
            echo
            echo 'Known advisory disposition for this unpublished trial (not a CVE fix):'
            echo '```json'
            cat .github/trial-advisory-disposition.json
            echo '```'
          } > "$RUNNER_TEMP/trial-notes.txt"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --skip=publish --release-notes=${{ runner.temp }}/trial-notes.txt
      - name: Check archives and scan every built binary before upload
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          python3 .github/scripts/check_trial_artifacts.py dist \
            --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" \
            --trial-disposition .github/trial-advisory-disposition.json \
            --evidence-directory binary-vulnerability-results
      - name: Retain every binary scan and disposition
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-vulnerability-results
          path: binary-vulnerability-results/
          if-no-files-found: warn
      - name: Upload only qualified archives to an unpublished trial draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --prerelease --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/trial-notes.txt" \
            dist/*.tar.gz dist/*.zip dist/*checksums.txt
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '.isDraft and .isPrerelease' | grep -x true
  smoke:
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_amd64
          - os: macos-14
            platform: darwin_arm64
          - os: windows-latest
            platform: windows_amd64
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          check-latest: true
      - name: Download and smoke-test unpublished native assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --dir downloaded --pattern "*_${PLATFORM}.*" --pattern '*checksums.txt'
          python3 .github/scripts/check_trial_artifacts.py downloaded \
            --version "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --smoke-platform "$PLATFORM" \
            --trial-disposition .github/trial-advisory-disposition.json \
            --evidence-directory binary-vulnerability-results
      - name: Retain downloaded-asset scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-vulnerability-results-${{ matrix.platform }}
          path: binary-vulnerability-results/
          if-no-files-found: warn
